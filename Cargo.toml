[package]
name = "fsearch"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Whole-disk file search for Windows: fuzzy names, typo tolerance, indexed content grep."

[lib]
name = "fsearch"
path = "src/lib.rs"

[[bin]]
name = "fsearch"
path = "src/main.rs"

[[bin]]
name = "fsearchui"
path = "src/bin/fsearchui.rs"

[[bin]]
name = "fsearchd"
path = "src/bin/fsearchd.rs"

[dependencies]
rayon = "1.12"
memchr = "2.8"
memmap2 = "0.9"
regex = "1.13"
regex-syntax = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Only the host backend needs it (MSG_PEEK for a non-consuming readiness check).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
egui = "0.29"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_RemoteDesktop",
    "Win32_System_WindowsProgramming",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_Time",
] }

[profile.release]
opt-level = 3
# Thin, not fat: with the GUI in the graph a whole-program fat-LTO
# merge can exhaust a CI runner's memory. Thin keeps cross-crate inlining
# where it matters and costs a fraction of the peak.
lto = "thin"
codegen-units = 1
debug = 1
